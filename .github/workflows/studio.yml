name: Studio CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

defaults:
  run:
    working-directory: studio

jobs:
  build:
    name: Install & Build Linux Electron App
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true

      - name: Install latest NPM v12
        run: npm install -g npm@12

      - name: Authenticate GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${CI_AUTH}" >> ~/.npmrc
        env:
          CI_AUTH: ${{ secrets.CI_AUTH }}

      - name: Install Dependencies
        run: npm ci --allow-remote=all

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Build Linux Prod App
        run: npm run build-prod:electron:linux

      - name: Upload Linux Electron Dist
        uses: actions/upload-artifact@v7
        with:
          name: studio_linux_electron
          path: studio/dist/electron/
          retention-days: 3

      - name: Upload Build Logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build_logs
          path: studio/tmp
          retention-days: 7

  integration-tests:
    name: 'Integration: ${{ matrix.suite }}'
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        suite:
          - bpmn-editor
          - core
          - dmn-editor
          - git-cruiser
          - plugins

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true

      - name: Authenticate GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${CI_AUTH}" >> ~/.npmrc
        env:
          CI_AUTH: ${{ secrets.CI_AUTH }}

      - name: Install latest NPM v12
        run: npm install -g npm@12

      - name: Configure Git Identity
        run: |
          git config --global user.email "ci@bifrostforge.world"
          git config --global user.name "CI Runner"
          git config --global init.defaultBranch main

      - name: Install Dependencies
        run: npm ci --allow-remote=all

      - name: Download Linux Electron Dist
        uses: actions/download-artifact@v8
        with:
          name: studio_linux_electron
          path: studio/dist/electron

      - name: Restore executable bits on unpacked app
        run: |
          find dist/electron/linux-unpacked -maxdepth 1 -type f -exec chmod +x {} \;

      - name: Resolve unpacked Electron binary
        id: electron_binary
        run: |
          binary="$(find dist/electron/linux-unpacked -maxdepth 1 -type f -name 'bfw-studio-*' ! -name '*-launcher' | sort | head -n 1)"
          if [ -z "$binary" ]; then
            echo "No bfw-studio Electron binary in dist/electron/linux-unpacked" >&2
            ls -la dist/electron/linux-unpacked >&2
            exit 1
          fi
          chmod +x "$binary"
          echo "path=$binary" >> "$GITHUB_OUTPUT"

      - name: Install Electron OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgtk-3-0 \
            libnotify4 \
            libnss3 \
            libxss1 \
            libxtst6 \
            libatspi2.0-0 \
            libsecret-1-0 \
            libasound2t64 \
            libgbm1 \
            libdrm2 \
            libxshmfence1

      - name: Disable AppArmor unprivileged userns restriction
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: 'Run Integration Tests: ${{ matrix.suite }}'
        env:
          TEST_APP_PATH: ${{ steps.electron_binary.outputs.path }}
        run: xvfb-run --auto-servernum -s "-screen 0 1920x1080x24" npm run test-prod:electron test:integration:${{ matrix.suite }}

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test_results_${{ matrix.suite }}
          path: |
            studio/tmp
            ~/.bifrostfw/studio-tests-backup-*
          retention-days: 7
